name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: enterprise_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d enterprise_platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/enterprise_platform_ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to CI PostgreSQL
        run: npx prisma migrate deploy
        env:
          NODE_ENV: test

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify critical concurrency behavior
        run: npm run verify:concurrency
        env:
          NODE_ENV: test

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
